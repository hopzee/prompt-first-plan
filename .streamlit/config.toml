[theme]
base = "light"
primaryColor = "#2E7D32"
backgroundColor = "#F7F5EE"
secondaryBackgroundColor = "#E6F0DF"
textColor = "#1E2A1E"
font = "sans serif"

[server]
headless = true
runOnSave = false
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "viewer"
